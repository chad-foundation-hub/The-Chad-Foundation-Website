[build]
  base = "."
  command = "cd frontend && npm install && npm run build"
  publish = "frontend/build"
  functions = "./netlify/functions" 

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

[dev]
  command = "npm start --prefix frontend"
  port = 8888
  targetPort = 3000 
  publish = "frontend/build"
  autoLaunch = true